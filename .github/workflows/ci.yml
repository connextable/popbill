name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: '@connextable/popbill-juso'
            alias: popbill-juso
            path: packages/popbill-juso
          - name: '@connextable/popbill-spec'
            alias: popbill-spec
            path: packages/popbill-spec
          - name: '@connextable/popbill-utils'
            alias: popbill-utils
            path: packages/popbill-utils
          - name: '@connextable/popbill-runtime'
            alias: popbill-runtime
            path: packages/popbill-runtime
          - name: '@connextable/popbill-compat'
            alias: popbill-compat
            path: packages/popbill-compat
          - name: '@connextable/popbill'
            alias: popbill
            path: packages/popbill

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.package.name }}
        id: build
        run: pnpm -C "${{ matrix.package.path }}" build

      - name: Archive build output
        id: archive_dist
        run: tar -czf "${RUNNER_TEMP}/dist-${{ matrix.package.alias }}.tgz" "${{ matrix.package.path }}/dist"

      - name: Upload build output
        id: upload_dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package.alias }}
          path: ${{ runner.temp }}/dist-${{ matrix.package.alias }}.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## CI build

          Package: `${{ matrix.package.name }}`

          | Check | Result |
          | --- | --- |
          | Install dependencies | ${{ steps.install.outcome || 'skipped' }} |
          | Build | ${{ steps.build.outcome || 'skipped' }} |
          | Archive build output | ${{ steps.archive_dist.outcome || 'skipped' }} |
          | Upload build output | ${{ steps.upload_dist.outcome || 'skipped' }} |
          SUMMARY

  package-work:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: '@connextable/popbill-juso'
            path: packages/popbill-juso
          - name: '@connextable/popbill-spec'
            path: packages/popbill-spec
          - name: '@connextable/popbill-utils'
            path: packages/popbill-utils
          - name: '@connextable/popbill-runtime'
            path: packages/popbill-runtime
          - name: '@connextable/popbill-compat'
            path: packages/popbill-compat
          - name: '@connextable/popbill'
            path: packages/popbill
          - name: '@connextable/popbill-examples'
            path: examples
        work:
          - lint
          - typecheck
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/ci-build-output

      - name: Restore build outputs
        id: restore_build
        run: |
          set -euo pipefail
          for archive in "${RUNNER_TEMP}"/ci-build-output/*/*.tgz; do
            tar -xzf "${archive}"
          done

      - name: Run ${{ matrix.work }} for ${{ matrix.package.name }}
        id: work
        run: pnpm -C "${{ matrix.package.path }}" run --if-present "${{ matrix.work }}"

      - name: Package work summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## CI package work

          Package: `${{ matrix.package.name }}`
          Work: `${{ matrix.work }}`

          | Check | Result |
          | --- | --- |
          | Install dependencies | ${{ steps.install.outcome || 'skipped' }} |
          | Restore build outputs | ${{ steps.restore_build.outcome || 'skipped' }} |
          | Run work | ${{ steps.work.outcome || 'skipped' }} |
          SUMMARY

  workspace-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace scripts
        id: typecheck_scripts
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Test release workflows
        id: test_release
        run: pnpm test:release

      - name: Workspace config summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## CI workspace config

          | Check | Result |
          | --- | --- |
          | Install dependencies | ${{ steps.install.outcome || 'skipped' }} |
          | Typecheck workspace scripts | ${{ steps.typecheck_scripts.outcome || 'skipped' }} |
          | Test release workflows | ${{ steps.test_release.outcome || 'skipped' }} |
          SUMMARY

  publish-preview:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/ci-build-output

      - name: Restore build outputs
        id: restore_build
        run: |
          set -euo pipefail
          for archive in "${RUNNER_TEMP}"/ci-build-output/*/*.tgz; do
            tar -xzf "${archive}"
          done

      - name: Verify publish manifests
        id: verify_manifests
        run: pnpm release verify-manifests

      - name: Pack publish targets
        id: pack
        run: |
          set -euo pipefail
          PACK_DIR="${RUNNER_TEMP}/popbill-pack"
          rm -rf "${PACK_DIR}"
          mkdir -p "${PACK_DIR}"
          pnpm -C packages/popbill-juso pack --pack-destination "${PACK_DIR}"
          pnpm -C packages/popbill-spec pack --pack-destination "${PACK_DIR}"
          pnpm -C packages/popbill-utils pack --pack-destination "${PACK_DIR}"
          pnpm -C packages/popbill-runtime pack --pack-destination "${PACK_DIR}"
          pnpm -C packages/popbill-compat pack --pack-destination "${PACK_DIR}"
          pnpm -C packages/popbill pack --pack-destination "${PACK_DIR}"
          pnpm release verify-tarballs "${PACK_DIR}"

      - name: Publish preview summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## CI publish preview

          | Check | Result |
          | --- | --- |
          | Install dependencies | ${{ steps.install.outcome || 'skipped' }} |
          | Restore build outputs | ${{ steps.restore_build.outcome || 'skipped' }} |
          | Verify publish manifests | ${{ steps.verify_manifests.outcome || 'skipped' }} |
          | Pack publish targets | ${{ steps.pack.outcome || 'skipped' }} |
          SUMMARY
