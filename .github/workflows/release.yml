name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease-id:
        description: 'Empty for stable; rc or beta for a prerelease'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source: ${{ steps.plan.outputs.source }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        uses: releaseway/actions/prepare@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          mode: plan
          prerelease-id: ${{ inputs.prerelease-id }}
          plan-path: ${{ runner.temp }}/release-plan.json

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify SDK
        run: pnpm check

      - name: Archive verified build
        run: tar -czf "${RUNNER_TEMP}/sdk-dist.tgz" packages/*/dist

      - name: Preserve plan and verified build
        id: build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.plan.outputs.plan-path }}
            ${{ runner.temp }}/sdk-dist.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout planned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source }}
          fetch-depth: 0

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-build
          digest-mismatch: error

      - name: Restore verified build
        run: tar -xzf "${RUNNER_TEMP}/release-build/sdk-dist.tgz"

      - name: Create or resume source tag
        id: release
        uses: releaseway/actions/prepare@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          mode: resume
          plan-path: ${{ runner.temp }}/release-build/release-plan.json

      - name: Publish npm packages
        id: npm
        uses: releaseway/npm-actions@c61fca168e342a622406ef7ee85a27c3a51e8de6 # v0.8.0
        with:
          release-tag: ${{ steps.release.outputs.tag }}

      - name: Configure GitHub Packages authentication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@connextable'

      - name: Mirror public tarballs to GitHub Packages
        env:
          NPM_PACKAGES: ${{ steps.npm.outputs.packages }}
          MIRROR_DIRECTORY: ${{ runner.temp }}/npm-mirror
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/mirror-github-packages.ts

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.release.outputs.diagnostics-path }}
            ${{ steps.npm.outputs.report-path }}
            ${{ steps.npm.outputs.diagnostics-path }}
          if-no-files-found: ignore
          retention-days: 7
